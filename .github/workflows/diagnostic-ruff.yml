name: Diagnostic Ruff

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install 'ruff>=0.9,<1'
      - name: Capture Ruff diagnostics
        run: ruff check . > ../ruff-diagnostics.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-diagnostics.txt
