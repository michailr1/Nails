name: Client diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      APP_TIMEZONE: Europe/Berlin
      INTERNAL_API_KEY: test-only-internal-api-key-0000000000000000
      DATABASE_URL: postgresql+psycopg://nails_app:nails_test@127.0.0.1:55432/nails_test
      CLIENT_API_ENABLED: "true"
      CLIENT_INTERNAL_API_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      WEB_AUTH_ENABLED: "true"
      WEB_AUTH_HMAC_KEY: wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww
      WEB_ALLOWED_HOSTS: testserver
      WEB_ALLOWED_ORIGINS: https://testserver
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip >/dev/null && pip install -e '.[dev]' >/dev/null
      - name: Import client schemas
        run: python -c "import app.schemas.client_contour"
      - name: Import client service
        run: python -c "import app.services.client_contour"
      - name: Import client API
        run: python -c "import app.api.client_contour"
      - name: Import application
        run: python -c "import app.main"
      - name: Import test conftest
        run: python -c "import tests.conftest"
      - name: Collect client contour tests
        run: pytest --collect-only -q tests/test_client_contour.py
